name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: |
          SDK_TOOL=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          "$SDK_TOOL" "platforms;android-35" "build-tools;35.0.0"
      - name: Core formula tests
        run: |
          mkdir -p /tmp/elektrik-test
          javac -d /tmp/elektrik-test app/src/main/java/com/msanc/elektrikatolyesi/Engineering.java tests/EngineeringTest.java
          java -cp /tmp/elektrik-test EngineeringTest
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Elektrik-Atolyesi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Allow emulator acceleration
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android screen smoke check
        uses: ReactiveCircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.android.launcher3
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb shell am start -n com.msanc.elektrikatolyesi/.MainActivity
            sleep 2
            adb shell screencap -p /sdcard/atelier-home.png
            adb pull /sdcard/atelier-home.png atelier-home.png
            adb shell input tap 540 900
            sleep 2
            adb shell screencap -p /sdcard/atelier-lab.png
            adb pull /sdcard/atelier-lab.png atelier-lab.png
            adb shell input keyevent 4
            sleep 1
            adb shell input tap 540 2050
            sleep 2
            adb shell screencap -p /sdcard/atelier-panel.png
            adb pull /sdcard/atelier-panel.png atelier-panel.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Elektrik-Atolyesi-ui-preview
          path: atelier-*.png
          if-no-files-found: ignore
