name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Core formula tests
        run: |
          mkdir -p /tmp/elektrik-test
          javac -d /tmp/elektrik-test app/src/main/java/com/msanc/elektrikatolyesi/Engineering.java tests/EngineeringTest.java
          java -cp /tmp/elektrik-test EngineeringTest
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Elektrik-Atolyesi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
